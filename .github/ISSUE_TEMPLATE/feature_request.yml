name: Feature request
description: Propose a runtime, compatibility, or tooling improvement
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem are you trying to solve?
      placeholder: Describe current pain point
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What change should be made?
      placeholder: Describe desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other options you evaluated
  - type: textarea
    id: risks
    attributes:
      label: Ownership or compatibility risks
      description: Call out thread-safety or behavior parity concerns
